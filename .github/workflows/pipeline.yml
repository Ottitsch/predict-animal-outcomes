name: training-pipeline

# Manual only -- does not run on every commit. Trigger from the Actions tab.
on:
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: configure git
        run: |
          git config user.name "ottitsch"
          git config user.email "ottitsch.work@gmail.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      - name: copy docker cli for host image
        run: cp "$(which docker)" docker-cli-bin

      - name: build images
        run: bash docker/build.sh dev host data-tests train robustness

      - name: run pipeline
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}":/work -w /work \
            -e GIT_COMMIT_SHA=${{ github.sha }} \
            pao-host:dev flow.py run --auto_commit False

      - name: save artifacts
        run: |
          git add runs/
          git commit --no-gpg-sign -m "ci: save run artifacts and model"
          git push origin "${{ github.ref_name }}"
